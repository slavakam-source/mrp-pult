<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MRP — слайд-шоу мониторов</title>
<style>
html,body{margin:0;height:100%;background:#0F1726;overflow:hidden;font-family:"Segoe UI",Roboto,Arial,sans-serif}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;opacity:0;transition:opacity .8s ease;background:#E6E9ED}
iframe.on{opacity:1;z-index:1}
#bar{position:fixed;right:1vw;bottom:1vh;z-index:5;display:flex;gap:.5em;align-items:center;
  background:rgba(15,23,38,.72);color:#fff;padding:.35em .7em;border-radius:1em;font-size:14px;opacity:.25;transition:opacity .3s}
#bar:hover{opacity:1}
#bar button{font:inherit;background:none;border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:.6em;padding:.1em .6em;cursor:pointer}
#bar i{display:inline-block;width:.6em;height:.6em;border-radius:50%;background:rgba(255,255,255,.35)}
#bar i.on{background:#fff}
#prog{position:fixed;left:0;bottom:0;height:3px;background:#4C8DFF;z-index:6;width:0}
</style>
</head>
<body>
<div id="bar"><span id="dots"></span><span id="name"></span>
  <button id="prev" title="←">‹</button><button id="pause" title="пробел">❚❚</button><button id="next" title="→">›</button></div>
<div id="prog"></div>
<script>
/* Слайд-шоу двух мониторов: ?t=секунд на экран (60), ?a= и ?b= — адреса страниц,
   ?dark=1 передаётся мониторам. Клавиши: ← → — листать, пробел — пауза.
   Оба монитора загружены заранее и сами обновляют данные — смена экрана мгновенная. */
(function(){
var Q = new URLSearchParams(location.search);
var T = Math.max(10, parseInt(Q.get('t') || '60', 10) || 60);
var pages = [Q.get('a') || 'monitor.html', Q.get('b') || 'switch_monitor.html'];
var names = ['Риски поставок', 'Переключения'];
var pass = Q.get('dark') === '1' ? '?dark=1' : '';
var frames = pages.map(function(src){
  var f = document.createElement('iframe'); f.src = src + (src.indexOf('?') < 0 ? pass : pass.replace('?', '&'));
  document.body.insertBefore(f, document.body.firstChild); return f;
});
var cur = 0, paused = false, startedAt = Date.now(), timer = null;
function $(id){ return document.getElementById(id) }
function show(i){
  cur = (i + frames.length) % frames.length;
  frames.forEach(function(f, n){ f.classList.toggle('on', n === cur) });
  $('dots').innerHTML = frames.map(function(_, n){ return '<i' + (n === cur ? ' class="on"' : '') + '></i>' }).join(' ');
  $('name').textContent = names[cur] || '';
  startedAt = Date.now();
}
function step(){
  if (paused) return;
  var p = (Date.now() - startedAt) / (T * 1000);
  $('prog').style.width = Math.min(100, p * 100) + '%';
  if (p >= 1) show(cur + 1);
}
$('prev').onclick = function(){ show(cur - 1) };
$('next').onclick = function(){ show(cur + 1) };
$('pause').onclick = function(){ paused = !paused; $('pause').textContent = paused ? '▶' : '❚❚'; if (!paused) startedAt = Date.now() };
document.addEventListener('keydown', function(e){
  if (e.key === 'ArrowRight') show(cur + 1);
  else if (e.key === 'ArrowLeft') show(cur - 1);
  else if (e.key === ' ') { e.preventDefault(); $('pause').onclick() }
});
show(0); timer = setInterval(step, 250);
})();
</script>
</body>
</html>
